<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界史 四択学習アプリ</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #2c3e50; font-size: 1.5em; }
  .filter-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
  select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1em; background-color: #fff; }
  button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1.1em; cursor: pointer; margin-top: 10px; font-weight: bold; transition: background-color 0.2s; }
  button:hover { background-color: #2980b9; }
  .choice-btn { background-color: #ecf0f1; color: #333; text-align: left; margin-bottom: 10px; padding: 15px; border-radius: 5px; font-size: 1em; }
  .choice-btn:hover { background-color: #d5dbdb; }
  .correct { background-color: #2ecc71 !important; color: white; }
  .wrong { background-color: #e74c3c !important; color: white; }
  #feedback { font-size: 1.2em; font-weight: bold; text-align: center; margin-top: 15px; min-height: 1.5em; }
  .hidden { display: none; }
  .meta-info { font-size: 0.8em; color: #7f8c8d; margin-bottom: 15px; text-align: center; }
  .score-display { text-align: center; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; color: #e67e22; }
  .stats-panel { margin-top: 15px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; background: #fafafa; }
  .stats-title { margin: 0 0 8px; font-size: 1em; color: #2c3e50; }
  .stats-total { font-weight: bold; color: #e67e22; margin-bottom: 8px; }
  .stats-list { margin: 0; padding-left: 18px; font-size: 0.9em; color: #555; }
  .stats-list li { margin-bottom: 4px; }
  .checkpoint-summary { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; background: #fafafa; margin-bottom: 12px; line-height: 1.6; }
  .checkpoint-mistakes { margin: 0; padding-left: 18px; font-size: 0.9em; color: #555; }
  .checkpoint-mistakes li { margin-bottom: 6px; }
  .explanation-panel { margin-top: 12px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; background: #f8fafc; }
  .explanation-title { font-weight: bold; margin-bottom: 6px; color: #34495e; }
  .explanation-item { font-size: 0.95em; line-height: 1.5; margin-bottom: 6px; }
  .explanation-item:last-child { margin-bottom: 0; }
  .analysis-panel { margin-top: 15px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; background: #f8fafc; }
  .analysis-title { font-weight: bold; margin-bottom: 6px; color: #34495e; }
  .analysis-result { margin-top: 8px; font-size: 0.9em; color: #333; line-height: 1.5; }
  .analysis-list { margin: 6px 0 0; padding-left: 18px; }
  .analysis-muted { color: #6b7280; font-size: 0.85em; margin-bottom: 6px; }
  .secondary-btn { background-color: #8e44ad; }
  .secondary-btn:hover { background-color: #7d3c98; }
  .celebrate { position: fixed; font-size: 18px; pointer-events: none; animation: pop 800ms ease-out forwards; z-index: 9999; }
  @keyframes pop {
    0% { transform: translateY(0) scale(0.8); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>

<div class="container" id="setup-screen">
  <h1>🌍 世界史 四択学習アプリ</h1>
  <p style="text-align:center; font-size:0.9em; color:#666;">フィルタを選んでスタートしてください</p>
  
  <div class="filter-group">
    <label>📌 ジャンル (人物・王朝など)</label>
    <select id="filter-type">
      <option value="すべて">すべて</option>
      <option value="人物">人物</option>
      <option value="王朝・国家">王朝・国家</option>
      <option value="文化・宗教">文化・宗教</option>
      <option value="その他">その他・出来事</option>
    </select>
  </div>

  <div class="filter-group">
    <label>📚 学習テーマ</label>
    <select id="filter-theme">
      <option value="すべて">すべて</option>
      <option value="中世ヨーロッパの展開">中世ヨーロッパの展開</option>
      <option value="大航海時代とルネサンス">大航海時代とルネサンス</option>
      <option value="アメリカ独立とフランス革命">アメリカ独立とフランス革命</option>
      <option value="帝国主義と二つの世界大戦">帝国主義と二つの世界大戦</option>
      <option value="文化史・科学史">文化史・科学史</option>
      <option value="その他">その他</option>
    </select>
  </div>

  <div class="filter-group">
    <label>🗺️ 地域</label>
    <select id="filter-region">
      <option value="すべて">すべて</option>
      <option value="オリエント・中東">オリエント・中東</option>
      <option value="ギリシア・ローマ">ギリシア・ローマ</option>
      <option value="インド・東南アジア">インド・東南アジア</option>
      <option value="中国・東アジア">中国・東アジア</option>
    </select>
  </div>

  <div class="filter-group">
    <label>⏳ 時代</label>
    <select id="filter-era">
      <option value="すべて">すべて</option>
      <option value="古代（紀元前）">古代（紀元前）</option>
      <option value="中世以降（〜世紀）">中世以降</option>
    </select>
  </div>

  <div class="filter-group">
    <label>🔥 難易度</label>
    <select id="filter-difficulty">
      <option value="すべて">すべて</option>
      <option value="簡単">簡単</option>
      <option value="普通">普通</option>
      <option value="難しい">難しい</option>
    </select>
  </div>

  <div class="filter-group">
    <label style="font-weight: normal;">
      <input type="checkbox" id="focus-mistakes-mode">
      ❗ 間違えた問題を重点的に解くモード
    </label>
  </div>

  <button onclick="startQuiz()">クイズをはじめる</button>

  <div class="stats-panel">
    <h2 class="stats-title">📊 撃破レポート</h2>
    <div class="stats-total" id="stats-total">総撃破問題数: 0</div>
    <div style="font-size:0.9em; font-weight:bold; margin-bottom:4px;">🗓 一日ごとの撃破数</div>
    <ul class="stats-list" id="daily-report-list"></ul>
    <div style="font-size:0.9em; font-weight:bold; margin:8px 0 4px;">📈 撃破数推移（累計）</div>
    <ul class="stats-list" id="trend-report-list"></ul>
  </div>

  <div class="analysis-panel">
    <div class="analysis-title">AI苦手分析</div>
    <div class="analysis-muted">不正解の選択肢を集計して、苦手分野を自動で解析します。</div>
    <button class="secondary-btn" onclick="analyzeMistakes()">AIに解析させる</button>
    <div id="analysis-result" class="analysis-result"></div>
  </div>
</div>

<div class="container hidden" id="quiz-screen">
  <div class="meta-info" id="question-meta"></div>
  <h2 id="question-text" style="font-size: 1.3em; line-height: 1.4;"></h2>
  <div id="choices-container"></div>
  <p id="feedback"></p>
  <div id="explanation-panel" class="explanation-panel hidden">
    <div class="explanation-title">AI解説</div>
    <div id="explanation-correct" class="explanation-item"></div>
    <div id="explanation-wrong" class="explanation-item hidden"></div>
  </div>
  <button id="next-btn" class="hidden" onclick="nextQuestion()">次の問題へ</button>
</div>

<div class="container hidden" id="result-screen">
  <h1>結果発表 🎉</h1>
  <div class="score-display" id="final-score"></div>
  <button onclick="returnToTitle()">タイトルに戻る</button>
</div>

<div class="container hidden" id="checkpoint-screen">
  <h1>📌 10問ごとの集計</h1>
  <div class="checkpoint-summary" id="checkpoint-summary"></div>
  <div style="font-size:0.95em; font-weight:bold; margin-bottom:6px;">間違えた問題</div>
  <ul class="checkpoint-mistakes" id="checkpoint-mistakes-list"></ul>
  <button onclick="continueFromCheckpoint()">続ける</button>
  <button onclick="returnToTitle()">タイトルに戻る</button>
</div>

  ["第一次世界大戦後の講和体制の中心となった1919年の条約は何か?","ヴェルサイユ条約","帝国主義と二つの世界大戦"],
  ["1929年にアメリカから始まり世界に拡大した経済危機は何か?","世界恐慌","帝国主義と二つの世界大戦"],
  ["ドイツでナチス政権を率いた指導者は誰か?","ヒトラー","帝国主義と二つの世界大戦"],
  ["第二次世界大戦後に発足した国際平和維持機構は何か?","国際連合","帝国主義と二つの世界大戦"],
  ["「社会契約論」を著し人民主権を唱えた思想家は誰か?","ルソー","文化史・科学史"],
  ["三権分立を説いた「法の精神」の著者は誰か?","モンテスキュー","文化史・科学史"],
  ["万有引力の法則を体系化した科学者は誰か?","ニュートン","文化史・科学史"],
  ["可動活字による印刷術を普及させた人物は誰か?","グーテンベルク","文化史・科学史"],
  ["19世紀後半のフランスでモネらが発展させた美術運動は何か?","印象派","文化史・科学史"]
];

// 問題の自動カテゴリ分けロジック
function analyzeQuestion(q, a) {
  let type = "その他";
  if (q.includes("誰") || q.includes("人物") || q.includes("王") || q.includes("帝")) type = "人物";
  else if (q.includes("朝") || q.includes("国") || q.includes("何人")) type = "王朝・国家";
  else if (q.includes("文字") || q.includes("宗教") || q.includes("教") || q.includes("文化")) type = "文化・宗教";

  let region = "その他";
  if (q.match(/エジプト|メソポタミア|シュメール|バビロン|オリエント|アケメネス|イスラム|ムハンマド/)) region = "オリエント・中東";
  else if (q.match(/ギリシア|アテネ|スパルタ|ローマ|マケドニア/)) region = "ギリシア・ローマ";
  else if (q.match(/インド|マウリヤ|東南アジア|ベトナム|ジャワ/)) region = "インド・東南アジア";
  else if (q.match(/中国|殷|周|秦|漢|随|唐|宋|元/)) region = "中国・東アジア";

  let era = "中世以降（〜世紀）";
  if (q.match(/万年前|紀元前|古代/)) era = "古代（紀元前）";

  let difficulty = "普通";
  if (a.length >= 6 || q.length >= 50) difficulty = "難しい";
  else if (a.length <= 3) difficulty = "簡単";

  return { type, region, era, difficulty };
}

// 問題のテーマジャンル判定ロジック
function analyzeTheme(q) {
  if (q.match(/封建|十字軍|カノッサ|ジャンヌ|百年戦争|黒死病|ペスト|教皇|騎士/)) {
    return "中世ヨーロッパの展開";
  }
  if (q.match(/大航海|コロンブス|マゼラン|ヴァスコ|ディアス|ルネサンス|メディチ|ダ=ヴィンチ|宗教改革|ルター|価格革命/)) {
    return "大航海時代とルネサンス";
  }
  if (q.match(/アメリカ独立|独立宣言|ワシントン|フランス革命|バスティーユ|人権宣言|ナポレオン|市民革命/)) {
    return "アメリカ独立とフランス革命";
  }
  if (q.match(/帝国主義|植民地|第一次世界大戦|第二次世界大戦|サラエボ|ヴェルサイユ|ヒトラー|ビスマルク|国際連盟|世界恐慌|ファシズム/)) {
    return "帝国主義と二つの世界大戦";
  }
  if (q.match(/社会契約論|ルソー|モンテスキュー|ロック|ホッブズ|啓蒙|活版印刷|万有引力|ニュートン|印象派|科学|思想/)) {
    return "文化史・科学史";
  }
  return "その他";
}

// データベースの構築
let questionDB = rawData.map(item => {
  const q = item[0];
  const a = item[1];
  const explicitTheme = item[2];
  const tags = analyzeQuestion(q, a);
  const theme = explicitTheme || analyzeTheme(q);
  return { question: q, answer: a, theme, ...tags };
});

// すべての答えのリスト（ダミーの選択肢を作るため）
const allAnswers = [...new Set(questionDB.map(d => d.answer))];

const STATS_KEY = "worldHistoryStatsV1";
const MISTAKE_KEY = "worldHistoryMistakeCountsV1";
const WRONG_CHOICE_KEY = "worldHistoryWrongChoiceCountsV1";
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answeredCount = 0;
let mistakeCounts = loadMistakeCounts();
let wrongChoiceCounts = loadWrongChoiceCounts();
let mistakeFocusMode = false;
let appStats = loadStats();
let sessionRecorded = false;
let segmentStartAnswered = 0;
let segmentStartScore = 0;
let segmentMistakes = [];

function getTodayDateKey() {
  return new Date().toLocaleDateString("en-CA");
}

function loadStats() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STATS_KEY) || "{}");
    const validatedStats = parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
    return {
      totalDefeated: Number(validatedStats.totalDefeated || 0),
      dailyDefeated: validatedStats.dailyDefeated && typeof validatedStats.dailyDefeated === "object" && !Array.isArray(validatedStats.dailyDefeated)
        ? validatedStats.dailyDefeated
        : {}
    };
  } catch (_) {
    return { totalDefeated: 0, dailyDefeated: {} };
  }
}

function saveStats() {
  localStorage.setItem(STATS_KEY, JSON.stringify(appStats));
}

function loadMistakeCounts() {
  try {
    const parsed = JSON.parse(localStorage.getItem(MISTAKE_KEY) || "{}");
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    return {};
  }
}

function saveMistakeCounts() {
  localStorage.setItem(MISTAKE_KEY, JSON.stringify(mistakeCounts));
}

function loadWrongChoiceCounts() {
  try {
    const parsed = JSON.parse(localStorage.getItem(WRONG_CHOICE_KEY) || "{}");
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    return {};
  }
}

function saveWrongChoiceCounts() {
  localStorage.setItem(WRONG_CHOICE_KEY, JSON.stringify(wrongChoiceCounts));
}

function recordWrongChoice(selected) {
  if (!selected) return;
  wrongChoiceCounts[selected] = (wrongChoiceCounts[selected] || 0) + 1;
  saveWrongChoiceCounts();
}

function addDefeatedStats(count) {
  if (!count || count <= 0) return;
  const day = getTodayDateKey();
  appStats.totalDefeated += count;
  appStats.dailyDefeated[day] = (appStats.dailyDefeated[day] || 0) + count;
  saveStats();
}

function renderHomeStats() {
  document.getElementById("stats-total").innerText = `総撃破問題数: ${appStats.totalDefeated}`;
  const days = Object.keys(appStats.dailyDefeated).sort().reverse();
  const dailyList = document.getElementById("daily-report-list");
  const trendList = document.getElementById("trend-report-list");
  dailyList.innerHTML = "";
  trendList.innerHTML = "";

  if (days.length === 0) {
    dailyList.innerHTML = "<li>まだ記録がありません</li>";
    trendList.innerHTML = "<li>クイズを解くと推移が表示されます</li>";
    return;
  }

  const recentDaysChronological = days.slice(0, 7).reverse();
  for (const d of recentDaysChronological) {
    const li = document.createElement("li");
    li.innerText = `${d}: ${appStats.dailyDefeated[d]}問`;
    dailyList.appendChild(li);
  }

  let cumulative = 0;
  const ascDays = [...days].reverse();
  for (const d of ascDays) {
    cumulative += appStats.dailyDefeated[d];
    const li = document.createElement("li");
    li.innerText = `${d}: ${cumulative}問`;
    trendList.appendChild(li);
  }
}

function getQuestionColorByMistake(count) {
  // 0回:標準 / 1回:警告 / 2回:強警告 / 3回:要復習 / 4回以上:最重要復習
  const colors = ["#2c3e50", "#d35400", "#c0392b", "#8e44ad", "#2d3436"];
  return colors[Math.min(count, colors.length - 1)];
}

function shuffleArray(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function findQuestionByAnswer(answer) {
  return questionDB.find(q => q.answer === answer);
}

function buildCorrectExplanation(qData) {
  return `正解「${qData.answer}」は「${qData.question}」に対応する用語です。分類: [${qData.theme}] [${qData.region}] [${qData.era}] [${qData.type}]。`;
}

function buildWrongExplanation(selected, qData) {
  const matched = findQuestionByAnswer(selected);
  if (matched) {
    return `不正解の選択肢「${selected}」は「${matched.question}」の答えで、[${matched.theme}] [${matched.region}] [${matched.era}]の内容です。今回は「${qData.theme}」の文脈に合いません。`;
  }
  return `不正解の選択肢「${selected}」は別の問題で使われる語ですが、今回の設問には一致しません。`;
}

function renderExplanation(qData, selected, isCorrect) {
  const panel = document.getElementById("explanation-panel");
  const correctEl = document.getElementById("explanation-correct");
  const wrongEl = document.getElementById("explanation-wrong");
  correctEl.innerText = buildCorrectExplanation(qData);
  if (isCorrect) {
    wrongEl.innerText = "";
    wrongEl.classList.add("hidden");
  } else {
    wrongEl.innerText = buildWrongExplanation(selected, qData);
    wrongEl.classList.remove("hidden");
  }
  panel.classList.remove("hidden");
}

function incrementAggregate(target, key, amount) {
  if (!key) return;
  target[key] = (target[key] || 0) + amount;
}

function getTopEntry(counts) {
  const entries = Object.entries(counts);
  if (entries.length === 0) return null;
  entries.sort((a, b) => b[1] - a[1]);
  return entries[0];
}

function getTopEntries(counts, limit) {
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, limit);
}

function formatAnalysisSummary(totalWrongChoices) {
  return `AI分析結果: 不正解の選択肢 ${totalWrongChoices}件を解析しました。`;
}

function analyzeMistakes() {
  const result = document.getElementById("analysis-result");
  result.innerHTML = "";
  const totalWrongChoices = Object.values(wrongChoiceCounts).reduce((sum, v) => sum + v, 0);
  if (totalWrongChoices === 0) {
    result.innerText = "まだ不正解データがありません。まずはクイズに挑戦してください。";
    return;
  }

  const aggregates = { theme: {}, region: {}, era: {}, type: {}, difficulty: {} };
  Object.entries(wrongChoiceCounts).forEach(([answer, count]) => {
    const qData = findQuestionByAnswer(answer);
    if (!qData) return;
    incrementAggregate(aggregates.theme, qData.theme, count);
    incrementAggregate(aggregates.region, qData.region, count);
    incrementAggregate(aggregates.era, qData.era, count);
    incrementAggregate(aggregates.type, qData.type, count);
    incrementAggregate(aggregates.difficulty, qData.difficulty, count);
  });

  const summary = document.createElement("div");
  summary.innerText = formatAnalysisSummary(totalWrongChoices);
  result.appendChild(summary);

  const list = document.createElement("ul");
  list.className = "analysis-list";
  const topTheme = getTopEntry(aggregates.theme);
  const topRegion = getTopEntry(aggregates.region);
  const topEra = getTopEntry(aggregates.era);
  const topType = getTopEntry(aggregates.type);
  const topDifficulty = getTopEntry(aggregates.difficulty);

  const addSummaryItem = (label, entry) => {
    if (!entry) return;
    const li = document.createElement("li");
    li.innerText = `${label}: ${entry[0]}（${entry[1]}回）`;
    list.appendChild(li);
  };
  addSummaryItem("苦手テーマ", topTheme);
  addSummaryItem("苦手地域", topRegion);
  addSummaryItem("苦手時代", topEra);
  addSummaryItem("苦手ジャンル", topType);
  addSummaryItem("苦手難易度", topDifficulty);

  const topWrongChoices = getTopEntries(wrongChoiceCounts, 3);
  if (topWrongChoices.length > 0) {
    const li = document.createElement("li");
    const details = topWrongChoices.map(([answer, count]) => {
      const qData = findQuestionByAnswer(answer);
      if (qData) {
        return `「${answer}」${count}回（${qData.theme}/${qData.region}）`;
      }
      return `「${answer}」${count}回`;
    });
    li.innerText = `よく選ぶ不正解: ${details.join(" / ")}`;
    list.appendChild(li);
  }

  const topQuestions = Object.entries(mistakeCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
  if (topQuestions.length > 0) {
    const li = document.createElement("li");
    const details = topQuestions.map(([question, count]) => `「${question}」${count}回`);
    li.innerText = `よく間違える問題: ${details.join(" / ")}`;
    list.appendChild(li);
  }

  if (list.childElementCount > 0) {
    result.appendChild(list);
  }
}

function startQuiz() {
  const filterType = document.getElementById("filter-type").value;
  const filterTheme = document.getElementById("filter-theme").value;
  const filterRegion = document.getElementById("filter-region").value;
  const filterEra = document.getElementById("filter-era").value;
  const filterDifficulty = document.getElementById("filter-difficulty").value;
  mistakeFocusMode = document.getElementById("focus-mistakes-mode").checked;

  // フィルタリング処理
  currentQuestions = questionDB.filter(q => {
    return (filterType === "すべて" || q.type === filterType) &&
           (filterTheme === "すべて" || q.theme === filterTheme) &&
           (filterRegion === "すべて" || q.region === filterRegion) &&
           (filterEra === "すべて" || q.era === filterEra) &&
           (filterDifficulty === "すべて" || q.difficulty === filterDifficulty);
  });

  // シャッフル
  currentQuestions = shuffleArray(currentQuestions);

  if (currentQuestions.length === 0) {
    alert("該当する問題がありません。フィルタ条件を変えてみてください。");
    return;
  }

  document.getElementById("setup-screen").classList.add("hidden");
  document.getElementById("quiz-screen").classList.remove("hidden");
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  sessionRecorded = false;
  segmentStartAnswered = 0;
  segmentStartScore = 0;
  segmentMistakes = [];
  showQuestion();
}

function showQuestion() {
  const qData = currentQuestions[currentIndex];
  const mistakes = mistakeCounts[qData.question] || 0;
  document.getElementById("question-meta").innerText = 
    `問題 ${currentIndex + 1} / ${currentQuestions.length} | [${qData.theme}] [${qData.region}] [${qData.era}] [${qData.difficulty}] [ミス:${mistakes}]`;
  document.getElementById("question-text").innerText = qData.question;
  document.getElementById("question-text").style.color = getQuestionColorByMistake(mistakes);
  document.getElementById("feedback").innerText = "";
  document.getElementById("explanation-panel").classList.add("hidden");
  document.getElementById("explanation-correct").innerText = "";
  const wrongExplanation = document.getElementById("explanation-wrong");
  wrongExplanation.innerText = "";
  wrongExplanation.classList.add("hidden");
  document.getElementById("next-btn").classList.add("hidden");

  // 選択肢の生成 (正解1つ + 不正解3つ)
  const wrongAnswers = [];
  const used = new Set([qData.answer]);
  const candidatePools = [
    questionDB.filter(q => q.theme === qData.theme && q.answer !== qData.answer).map(q => q.answer),
    questionDB.filter(q => q.region === qData.region && q.era === qData.era && q.answer !== qData.answer).map(q => q.answer),
    questionDB.filter(q => q.region === qData.region && q.answer !== qData.answer).map(q => q.answer),
    allAnswers.filter(a => a !== qData.answer)
  ];

  for (const pool of candidatePools) {
    const shuffledPool = shuffleArray([...new Set(pool)]);
    for (const ans of shuffledPool) {
      if (wrongAnswers.length >= 3) break;
      if (!used.has(ans)) {
        wrongAnswers.push(ans);
        used.add(ans);
      }
    }
    if (wrongAnswers.length >= 3) break;
  }

  while (wrongAnswers.length < 3) {
    const randomAns = allAnswers[Math.floor(Math.random() * allAnswers.length)];
    if (!used.has(randomAns)) {
      wrongAnswers.push(randomAns);
      used.add(randomAns);
    }
  }
  const choicesArray = shuffleArray([qData.answer, ...wrongAnswers]);

  const container = document.getElementById("choices-container");
  container.innerHTML = "";
  
  choicesArray.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerText = choice;
    btn.onclick = () => checkAnswer(btn, choice, qData);
    container.appendChild(btn);
  });
}

function checkAnswer(btn, selected, qData) {
  const correct = qData.answer;
  // ボタンを非活性化
  const buttons = document.querySelectorAll(".choice-btn");
  buttons.forEach(b => b.disabled = true);

  if (selected === correct) {
    btn.classList.add("correct");
    document.getElementById("feedback").innerText = "⭕ 正解！";
    document.getElementById("feedback").style.color = "#2ecc71";
    spawnCelebrateEffect(btn, ["✨", "🎉", "🏆"]);
    score++;
  } else {
    btn.classList.add("wrong");
    document.getElementById("feedback").innerText = `❌ 不正解... (正解は: ${correct})`;
    document.getElementById("feedback").style.color = "#e74c3c";
    const wrongQuestion = currentQuestions[currentIndex].question;
    segmentMistakes.push({
      question: wrongQuestion,
      selected,
      correct
    });
    mistakeCounts[wrongQuestion] = (mistakeCounts[wrongQuestion] || 0) + 1;
    saveMistakeCounts();
    recordWrongChoice(selected);
    document.getElementById("question-text").style.color =
      getQuestionColorByMistake(mistakeCounts[wrongQuestion]);

    if (mistakeFocusMode) {
      const reviewQuestion = currentQuestions[currentIndex];
      // 1〜3問先に再配置して、近いタイミングで復習できるようにする
      const minInsertPos = currentIndex + 1;
      const maxInsertPosExclusive = Math.min(currentIndex + 4, currentQuestions.length + 1);
      if (minInsertPos < maxInsertPosExclusive) {
        const insertPos = minInsertPos + Math.floor(Math.random() * (maxInsertPosExclusive - minInsertPos));
        currentQuestions.splice(insertPos, 0, reviewQuestion);
      }
    }
    // 正解のボタンを緑にする
    buttons.forEach(b => {
      if(b.innerText === correct) b.classList.add("correct");
    });
  }
  renderExplanation(qData, selected, selected === correct);
  answeredCount++;
  document.getElementById("next-btn").classList.remove("hidden");
}

function summarizeCurrentSegment() {
  const solvedCount = answeredCount - segmentStartAnswered;
  const correctCount = score - segmentStartScore;
  const wrongCount = solvedCount - correctCount;
  return { solvedCount, correctCount, wrongCount };
}

function finalizeCurrentSegmentStats() {
  const { correctCount } = summarizeCurrentSegment();
  if (correctCount > 0) {
    addDefeatedStats(correctCount);
    renderHomeStats();
  }
  segmentStartAnswered = answeredCount;
  segmentStartScore = score;
  segmentMistakes = [];
}

function showCheckpointScreen() {
  const { solvedCount, correctCount, wrongCount } = summarizeCurrentSegment();
  const summary = document.getElementById("checkpoint-summary");
  summary.innerHTML = `
    解いた問題数: ${solvedCount}問<br>
    正解: ${correctCount}問<br>
    不正解: ${wrongCount}問
  `;

  const mistakeList = document.getElementById("checkpoint-mistakes-list");
  mistakeList.innerHTML = "";
  if (segmentMistakes.length === 0) {
    const li = document.createElement("li");
    li.innerText = "この区間は全問正解でした！";
    mistakeList.appendChild(li);
  } else {
    segmentMistakes.forEach((m, idx) => {
      const li = document.createElement("li");
      li.innerText = `${idx + 1}. ${m.question} / あなたの回答: ${m.selected} / 正解: ${m.correct}`;
      mistakeList.appendChild(li);
    });
  }

  finalizeCurrentSegmentStats();
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("checkpoint-screen").classList.remove("hidden");
}

function continueFromCheckpoint() {
  document.getElementById("checkpoint-screen").classList.add("hidden");
  document.getElementById("quiz-screen").classList.remove("hidden");
  showQuestion();
}

function spawnCelebrateEffect(targetBtn, symbols) {
  const rect = targetBtn.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const e = document.createElement("div");
    e.className = "celebrate";
    e.innerText = symbols[Math.floor(Math.random() * symbols.length)];
    e.style.left = `${rect.left + rect.width / 2 + (Math.random() * 80 - 40)}px`;
    e.style.top = `${rect.top + rect.height / 2 + (Math.random() * 20 - 10)}px`;
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 850);
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    if (answeredCount % 10 === 0) {
      showCheckpointScreen();
    } else {
      showQuestion();
    }
  } else {
    if (!sessionRecorded) {
      finalizeCurrentSegmentStats();
      sessionRecorded = true;
    }
    renderHomeStats();
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("checkpoint-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    document.getElementById("final-score").innerText = 
      `${currentQuestions.length}問中、${score}問正解しました！`;
  }
}

function returnToTitle() {
  currentQuestions = [];
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  segmentStartAnswered = 0;
  segmentStartScore = 0;
  segmentMistakes = [];
  document.getElementById("result-screen").classList.add("hidden");
  document.getElementById("checkpoint-screen").classList.add("hidden");
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("setup-screen").classList.remove("hidden");
  renderHomeStats();
}
renderHomeStats();
</script>
